name: Numerical validation

on: [push, pull_request]

jobs:
  pricing:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python tests/test_pricing.py -v
      - run: python tests/test_lsm_procedure.py -v
      - run: python tests/test_experiment_files.py -v

  visualizations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build.py
      - run: python scripts/run_experiments.py --quick
      - run: python scripts/plot_results.py --quick
      - run: python scripts/run_lsm_paper.py --quick
      - run: python scripts/plot_lsm_paper.py --quick
      - run: python scripts/run_lsm_comparison.py --quick
      - run: python scripts/plot_lsm_comparison.py --quick
